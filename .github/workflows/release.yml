name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "ads_mcp/**"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "README.md"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/*container.py"
      - "tests/container_release_test.py"
      - "docs/releasing.md"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ghcr-rehearsal:
        description: "Test GHCR in a fork without publishing to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize production releases so backfills cannot race latest promotion.
  group: release-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Validate and prepare the package version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          pyproject_path = pathlib.Path("pyproject.toml")
          pyproject_text = pyproject_path.read_text(encoding="utf-8")
          project = tomllib.loads(pyproject_text)["project"]
          declared_version = project["version"]

          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", declared_version):
              raise SystemExit(
                  "project.version must use the X.Y.Z form required by the "
                  "release workflow"
              )

          event_name = os.environ["EVENT_NAME"]
          package_version = declared_version

          if event_name == "push":
              expected_tag = f"v{declared_version}"
              if os.environ["REF_NAME"] != expected_tag:
                  raise SystemExit(
                      f"tag {os.environ['REF_NAME']!r} does not match "
                      f"project.version {declared_version!r}"
                  )
          elif event_name == "workflow_dispatch":
              package_version = f"{declared_version}.dev{os.environ['RUN_ID']}"
              updated_text, replacements = re.subn(
                  r'(?m)^version = "[^"]+"$',
                  f'version = "{package_version}"',
                  pyproject_text,
                  count=1,
              )
              if replacements != 1:
                  raise SystemExit(
                      "could not update exactly one project.version entry"
                  )
              pyproject_path.write_text(updated_text, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"package-version={package_version}", file=output)
          PY

      - name: Validate the production tag
        if: github.event_name == 'push'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production tags must use the exact vX.Y.Z form." >&2
            exit 1
          fi

          git fetch origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]; then
            echo "Production releases require an annotated tag." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "The tagged commit is not part of origin/main." >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/google-ads-mcp/{version}/json"
          request = urllib.request.Request(
              url,
              headers={"Accept": "application/json"},
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  raise SystemExit(0)
              raise

          raise SystemExit(
              f"google-ads-mcp {version} already exists on PyPI; "
              "published versions cannot be replaced"
          )
          PY

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Inspect distribution contents
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          python - <<'PY'
          import email
          import os
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          source_distributions = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(source_distributions) != 1:
              raise SystemExit("expected exactly one wheel and one sdist")

          version = os.environ["PACKAGE_VERSION"]
          required_package_data = {
              "ads_mcp/gaql_resources.txt",
              "ads_mcp/tools_config.yaml",
          }

          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              missing = required_package_data - names
              if missing:
                  raise SystemExit(f"wheel is missing package data: {sorted(missing)}")

              metadata_names = [
                  name for name in names if name.endswith(".dist-info/METADATA")
              ]
              license_names = [
                  name
                  for name in names
                  if ".dist-info/" in name and name.endswith("/LICENSE")
              ]
              if len(metadata_names) != 1 or not license_names:
                  raise SystemExit("wheel is missing metadata or the license")

              metadata = email.message_from_bytes(
                  archive.read(metadata_names[0])
              )
              if metadata["Version"] != version:
                  raise SystemExit(
                      f"wheel version {metadata['Version']!r} does not match "
                      f"{version!r}"
                  )
              if not metadata.get_payload().strip():
                  raise SystemExit("wheel metadata is missing the README content")

          with tarfile.open(source_distributions[0], "r:gz") as archive:
              names = set(archive.getnames())

          def sdist_contains(relative_path):
              return any(
                  name.partition("/")[2] == relative_path for name in names
              )

          required_sdist_files = {
              "LICENSE",
              "README.md",
              *required_package_data,
          }
          missing = {
              path for path in required_sdist_files if not sdist_contains(path)
          }
          if missing:
              raise SystemExit(f"sdist is missing files: {sorted(missing)}")
          PY

      - name: Install and inspect the wheel
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --no-deps dist/*.whl
          .release-venv/bin/python - <<'PY'
          import importlib.metadata
          import importlib.resources
          import os

          import ads_mcp

          installed_version = importlib.metadata.version("google-ads-mcp")
          if installed_version != os.environ["PACKAGE_VERSION"]:
              raise SystemExit(
                  f"installed version {installed_version!r} does not match "
                  f"{os.environ['PACKAGE_VERSION']!r}"
              )

          package_files = importlib.resources.files(ads_mcp)
          for filename in ("gaql_resources.txt", "tools_config.yaml"):
              if not package_files.joinpath(filename).is_file():
                  raise SystemExit(f"installed wheel is missing {filename}")
          PY

      - name: Generate checksums
        run: |
          mkdir -p release-assets
          sha256sum dist/* > release-assets/SHA256SUMS

      - name: Upload validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions-${{ github.run_id }}
          path: |
            dist/*
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  build-container:
    name: Build and validate container
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test container publication policy
        run: python3 -m unittest tests/container_release_test.py

      - name: Build the release image
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --tag release-container:validated .
          timeout 90 docker run --rm --network none -i \
            --env "PACKAGE_VERSION=$version" --entrypoint python \
            release-container:validated - < scripts/check_container.py
          mkdir -p container-artifact
          docker save release-container:validated > container-artifact/image.tar
          cd container-artifact
          sha256sum image.tar > SHA256SUMS

      - name: Upload the tested image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-container-${{ github.run_id }}
          path: container-artifact/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && !inputs.ghcr-rehearsal
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/google-ads-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions-${{ github.run_id }}
          path: artifact

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: artifact/dist/
          repository-url: https://test.pypi.org/legacy/

  rehearse-ghcr:
    name: Rehearse GHCR publication in a fork
    if: github.event_name == 'workflow_dispatch' && inputs.ghcr-rehearsal && github.repository != 'googleads/google-ads-mcp'
    needs: [build, build-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the publication script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-container-${{ github.run_id }}
          path: container-artifact

      - name: Verify and load the tested image
        working-directory: container-artifact
        run: |
          sha256sum --check SHA256SUMS
          docker load --input image.tar

      - name: Publish to the isolated rehearsal package
        env:
          GHCR_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          export IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}-ghcr-rehearsal"
          PACKAGE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          export PACKAGE_VERSION
          python3 scripts/publish_container.py

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, build-container]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/google-ads-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions-${{ github.run_id }}
          path: artifact

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: artifact/dist/

  publish-ghcr:
    name: Publish container to GHCR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, build-container, publish-pypi]
    runs-on: ubuntu-latest
    # The successful protected PyPI job is the production approval gate.
    # GHCR uses GITHUB_TOKEN and does not require a separate environment.
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.publish.outputs.reference }}
      latest: ${{ steps.publish.outputs.latest }}
    steps:
      - name: Check out the publication script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-container-${{ github.run_id }}
          path: container-artifact

      - name: Verify and load the tested image
        working-directory: container-artifact
        run: |
          sha256sum --check SHA256SUMS
          docker load --input image.tar

      - name: Publish version and latest tags
        id: publish
        env:
          GHCR_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          export IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 scripts/publish_container.py

  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - publish-pypi
      - publish-ghcr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download validated release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions-${{ github.run_id }}
          path: artifact

      - name: Create or resume the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONTAINER_REFERENCE: ${{ needs.publish-ghcr.outputs.reference }}
          IS_LATEST: ${{ needs.publish-ghcr.outputs.latest }}
        run: |
          is_draft=true
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(
              gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft
            )"
            if [ "$is_draft" != "true" ]; then
              for asset in artifact/dist/* artifact/release-assets/SHA256SUMS; do
                asset_name="$(basename "$asset")"
                if ! gh release view "$GITHUB_REF_NAME" --json assets \
                  --jq '.assets[].name' | grep -Fxq "$asset_name"; then
                  echo "Published release is missing asset $asset_name." >&2
                  exit 1
                fi
              done
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi

          if [ "$is_draft" = "true" ]; then
            gh release upload "$GITHUB_REF_NAME" \
              artifact/dist/* \
              artifact/release-assets/SHA256SUMS \
              --clobber
          fi
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > release-notes.md
          if ! grep -Fq "$CONTAINER_REFERENCE" release-notes.md; then
            # shellcheck disable=SC2016
            printf '\n## Container image (linux/amd64)\n\n`docker pull %s`\n' \
              "$CONTAINER_REFERENCE" >> release-notes.md
          fi
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md \
            --latest="$IS_LATEST" --draft=false
